# ===========================================================================
# Configuración base (la que se usa en producción). Los secretos y datos de
# conexión se leen de VARIABLES DE ENTORNO: nada sensible va en el repositorio.
#   DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS
# Para desarrollo local se activa por defecto el perfil "local"
# (application-local.properties). En producción: SPRING_PROFILES_ACTIVE=prod
# ===========================================================================
spring.application.name=serviya
spring.profiles.default=local
server.port=${PORT:8080}

# --- Base de datos ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# validate: Hibernate NO modifica el esquema en producción (usa schema.sql / migraciones)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
# (se quitó spring.jpa.database-platform=MySQL8Dialect: está deprecado, Hibernate lo detecta solo)

# --- JWT --- (generar con: openssl rand -base64 48)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS / WebSocket: orígenes permitidos separados por coma ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Varios ---
# (true = comportamiento histórico del proyecto; varios servicios leen relaciones LAZY en la capa web)
spring.jpa.open-in-view=true
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=INFO
logging.level.com.ServiYa=INFO
